name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build patch archives
        run: bash build.sh

      - name: Release
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" patch_atmos.zip patch_yuzu.zip \
            --title "$TAG - Traduccion al espanol (V1)" \
            --notes "Traduccion al espanol V1: todo el guion traducido (EP1-8 + extras Tsubasa/Hane/Saku + titulos de capitulo). Faltan las imagenes con texto (logos/menus), que se traduciran en una version posterior. Gracias a Yumenocha por impulsar esta traduccion. Descarga patch_yuzu.zip (yuzu/Eden/Android) o patch_atmos.zip (Ryujinx/consola)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
